<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>multiTerminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toolbar">
    <div class="toolbar-group">
      <select id="templateSelect"></select>
      <button id="splitRowBtn" title="Split side by side">⬌ Split</button>
      <button id="splitColBtn" title="Split stacked">⬍ Split</button>
      <button id="addFirstBtn" title="Add first terminal">+ Terminal</button>
    </div>
    <div class="toolbar-group">
      <label for="presetSelect">Layout</label>
      <select id="presetSelect">
        <option value="">Presets…</option>
        <option value="1x1">1 x 1</option>
        <option value="1x2">1 x 2</option>
        <option value="2x1">2 x 1</option>
        <option value="2x2">2 x 2</option>
        <option value="2x3">2 x 3</option>
        <option value="3x2">3 x 2</option>
        <option value="3x3">3 x 3</option>
        <option value="3x4">3 x 4</option>
        <option value="4x3">4 x 3</option>
        <option value="4x4">4 x 4</option>
        <option value="3x6">3 x 6</option>
        <option value="4x6">4 x 6</option>
        <option value="6x4">6 x 4</option>
      </select>
    </div>
    <div class="toolbar-group">
      <button id="openFolderBtn" title="Open one terminal per subfolder, cd'd into each">📁 Open Folder…</button>
    </div>
    <div class="toolbar-group broadcast-group">
      <input id="broadcastInput" type="text" placeholder="Type to broadcast to all terminals…" />
      <label class="enter-toggle"><input id="broadcastEnter" type="checkbox" checked /> ⏎</label>
      <button id="broadcastBtn">Send to all</button>
    </div>
  </div>
  <div id="gridRoot"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
