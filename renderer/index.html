<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data:; script-src 'self';" />
  <title>multiTerminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <header id="titlebar">
    <div class="brand"><span class="mark"></span>multiTerminal</div>
    <div class="status-strip" id="statusStrip">
      <button class="status-chip attention" id="chipAttention" hidden>
        <span class="dot"></span><span class="n">0</span> warten auf dich
      </button>
      <button class="status-chip running" id="chipRunning" hidden>
        <span class="dot"></span><span class="n">0</span> laufen
      </button>
      <button class="status-chip idle" id="chipIdle" hidden>
        <span class="dot"></span><span class="n">0</span> idle
      </button>
      <button class="status-chip exited" id="chipExited" hidden>
        <span class="dot"></span><span class="n">0</span> beendet
      </button>
    </div>
    <div class="spacer"></div>
    <button class="icon" id="paletteBtn" title="Befehle (Ctrl+K)">⌘</button>
    <button class="icon" id="settingsBtn" title="Einstellungen (Ctrl+,)">⚙</button>
  </header>

  <nav id="toolbar">
    <div class="tool-group">
      <select id="templateSelect" title="Template für neue Terminals"></select>
    </div>
    <div class="sep"></div>
    <div class="tool-group">
      <div class="split-button">
        <button id="newTermBtn" title="Neues Terminal (Ctrl+T)">＋ Terminal</button>
        <button class="caret" id="newTermMenuBtn" title="Mehr Optionen">▾</button>
      </div>
      <button class="icon" id="splitRightBtn" title="Rechts teilen (Ctrl+\)">▥</button>
      <button class="icon" id="splitDownBtn" title="Unten teilen (Ctrl+Shift+\)">▤</button>
    </div>
    <div class="sep"></div>
    <div class="tool-group">
      <select id="presetSelect" title="Raster-Layout anwenden">
        <option value="">Layout…</option>
        <option value="1x1">1 × 1</option>
        <option value="1x2">1 × 2</option>
        <option value="2x1">2 × 1</option>
        <option value="2x2">2 × 2</option>
        <option value="2x3">2 × 3</option>
        <option value="3x2">3 × 2</option>
        <option value="3x3">3 × 3</option>
        <option value="2x4">2 × 4</option>
        <option value="4x2">4 × 2</option>
        <option value="3x4">3 × 4</option>
        <option value="4x4">4 × 4</option>
        <option value="auto">Automatisch ausbalancieren</option>
      </select>
      <button class="icon" id="zoomBtn" title="Pane zoomen (Ctrl+Shift+Z)">⛶</button>
    </div>
    <div class="sep"></div>
    <div class="tool-group">
      <div class="split-button">
        <button id="openFoldersBtn" title="Ordner öffnen (Ctrl+O)">📁 Ordner</button>
        <button class="caret" id="openFoldersMenuBtn" title="Mehr Optionen">▾</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="tool-group">
      <button class="icon" id="searchBtn" title="Im Pane suchen (Ctrl+Shift+F)">🔍</button>
      <button class="icon" id="closePaneBtn" title="Pane schließen (Ctrl+W)">✕</button>
    </div>
  </nav>

  <main id="gridRoot"></main>

  <section id="composer">
    <div class="composer-top">
      <div class="target-chips" id="targetChips"></div>
      <span class="target-summary" id="targetSummary"></span>
      <div class="spacer"></div>
      <label class="toggle" title="Nach dem Text ein Enter senden, damit der Befehl ausgeführt wird">
        <input type="checkbox" id="sendEnter" checked /> Enter anhängen
      </label>
      <label class="toggle" title="Platzhalter wie {{folder}} pro Terminal ersetzen">
        <input type="checkbox" id="useVars" checked /> Variablen
      </label>
      <button class="icon" id="promptSaveBtn" title="Aktuellen Text als Prompt in der Bibliothek speichern">☆</button>
    </div>

    <div class="composer-row">
      <textarea id="composerInput" rows="1" spellcheck="false"
        title="⏎ senden · ⇧⏎ neue Zeile · ↑ Verlauf · Platzhalter: {{folder}} {{path}} {{name}} {{index}} {{count}}"
        placeholder="Prompt an die Ziel-Terminals…   ⏎ senden · ⇧⏎ neue Zeile · ↑ Verlauf"></textarea>
      <div class="send-stack">
        <button class="primary" id="sendBtn">Senden</button>
      </div>
    </div>

    <div class="composer-bottom">
      <div class="prompt-chips" id="promptChips"></div>
      <div class="quick-keys" id="quickKeys">
        <button data-send="\r" title="Enter an Ziele">⏎</button>
        <button data-send="y\r" title="y + Enter — Approval bestätigen">y</button>
        <button data-send="n\r" title="n + Enter — Approval ablehnen">n</button>
        <button data-send="" title="Escape — Claude Code unterbrechen">esc</button>
        <button data-send="" title="Ctrl+C — Prozess abbrechen">^C</button>
        <button data-send="[A\r" title="Letzten Befehl wiederholen">↑⏎</button>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ folders -->
  <div class="overlay" id="folderSheet" hidden>
    <div class="sheet">
      <div class="sheet-header">
        <h3>Ordner öffnen</h3>
        <span class="sub" id="folderHint">Ein Terminal pro Ordner</span>
        <div class="spacer"></div>
        <button class="solid" id="folderNativeBtn" title="Systemdialog verwenden">Systemdialog…</button>
        <button class="icon" id="folderRevealBtn" title="Im Dateimanager öffnen">↗</button>
      </div>
      <div class="folder-bar">
        <button class="icon" id="folderUpBtn" title="Eine Ebene höher (Backspace)">↑</button>
        <button class="icon" id="folderHomeBtn" title="Home">⌂</button>
        <input type="text" id="folderPath" spellcheck="false" title="Pfad eingeben und Enter drücken" />
        <div class="drive-chips" id="folderDrives"></div>
      </div>
      <div class="folder-filterbar">
        <input type="search" id="folderFilter" spellcheck="false"
          title="Tippen filtert · ↑↓ navigiert · ⏎ öffnet den Ordner · Ctrl+⏎ oder Leertaste wählt ihn aus · ⌫ eine Ebene höher"
          placeholder="Filtern…  ↑↓ navigieren · ⏎ öffnen · Leertaste wählen" />
        <button class="solid" id="folderScanBtn" title="Alle Projekte (Git-Repos, package.json, …) unterhalb dieses Ordners finden">Projekte finden</button>
        <label class="toggle"><input type="checkbox" id="folderShowHidden" /> Versteckte</label>
        <button id="folderSelectAllBtn" title="Alle sichtbaren auswählen (Ctrl+A)">Alle</button>
        <button id="folderClearBtn">Keine</button>
      </div>
      <div class="sheet-body"><div class="folder-list" id="folderList"></div></div>
      <div class="picked-strip" id="folderPicked"></div>
      <div class="sheet-footer">
        <label class="toggle"><input type="checkbox" id="folderReplace" /> Bestehende Terminals ersetzen</label>
        <div class="spacer"></div>
        <button id="folderCancelBtn">Abbrechen</button>
        <button class="primary" id="folderConfirmBtn">Öffnen</button>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------------- palette -->
  <div class="overlay overlay-align" id="paletteSheet" hidden>
    <div class="sheet">
      <input type="text" id="paletteInput" placeholder="Befehl suchen…" spellcheck="false" />
      <div class="sheet-body"><div class="palette-list" id="paletteList"></div></div>
    </div>
  </div>

  <!-- ------------------------------------------------------------ settings -->
  <div class="overlay" id="settingsSheet" hidden>
    <div class="sheet">
      <div class="sheet-header">
        <h3>Einstellungen</h3>
        <div class="spacer"></div>
        <button class="icon" id="settingsCloseBtn">✕</button>
      </div>
      <div class="sheet-body"><div class="settings-body" id="settingsBody"></div></div>
      <div class="sheet-footer">
        <button id="openConfigBtn">Konfigurationsordner öffnen</button>
        <button id="openTemplatesBtn">Templates-Ordner öffnen</button>
      </div>
    </div>
  </div>

  <div id="dropZone">
    <div class="dz-inner">
      <div class="big">Ordner hier ablegen</div>
      <div>Für jeden Ordner wird ein Terminal geöffnet</div>
    </div>
  </div>

  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
